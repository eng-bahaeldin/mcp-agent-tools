[project]
name = "mcp-agent-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "bahaa.ahmed.eng@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "mcp[cli]>=1.25.0,<2.0.0",
    "openai>=3.50.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "python-dotenv>=1.2.4",
    "sqlparse>=0.6.1",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mcp-agent-tools = "mcp_agent_tools:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
